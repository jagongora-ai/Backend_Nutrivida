spring.application.name=ms-pagos
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/bd_pagos?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html
spring.jackson.deserialization.fail-on-unknown-properties=true

agenda.service-id=ms-agendar
servicios.clave-interna=clave-interna-de-ejemplo
server.forward-headers-strategy=framework

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Mientras no exista el servidor Eureka, ms-agendar se encuentra con esta lista fija.
# Cuando el equipo levante Eureka, se borran estas lineas y eureka.client.enabled vuelve a true.
eureka.client.enabled=false
spring.cloud.discovery.client.simple.instances.ms-agendar[0].uri=http://localhost:8083

jwt.secret=nutrivida-clave-de-ejemplo-cambiar-por-una-propia-2026
cors.origen=http://localhost:5173

