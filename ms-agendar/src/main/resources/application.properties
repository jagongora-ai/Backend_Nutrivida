spring.application.name=ms-agendar
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/bd_agenda?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Mientras no exista el servidor Eureka, los nombres de los micros se resuelven con esta lista fija.
# Cuando el equipo levante Eureka, se borran estas lineas y eureka.client.enabled vuelve a true.
eureka.client.enabled=false
spring.cloud.discovery.client.simple.instances.ms-profesionales[0].uri=http://localhost:8082

jwt.secret=nutrivida-clave-de-ejemplo-cambiar-por-una-propia-2026
cors.origen=http://localhost:5173

servicios.profesionales.url=http://ms-profesionales
servicios.clave-interna=clave-interna-de-ejemplo
