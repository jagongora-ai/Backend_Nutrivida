spring.application.name=ms-agendar
server.port=8083
 
spring.datasource.url=jdbc:mysql://localhost:3306/bd_agenda?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
 
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

jwt.secret=clave-de-ejemplo-nutrivida-cambiar-en-local-0123456789
jwt.expiracion=7200000

cors.origen=http://localhost:5173

servicios.clave-interna=clave-interna-de-ejemplo

servicios.profesionales.url=http://ms-profesionales
servicios.usuarios.url=http://ms-usuarios
